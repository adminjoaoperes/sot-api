<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOT - Consulta Taxonômica</title>

    <style>

        :root {
            --verde-musgo: #556B2F;
            --verde-musgo-escuro: #3F5222;
            --verde-claro: #E8EEDC;
            --fundo: #F5F6F2;
            --branco: #FFFFFF;
            --texto: #273026;
            --cinza: #6B716B;
            --borda: #DDE2D8;
            --verde-status: #3F7D35;
            --vermelho: #A94442;
            --amarelo: #A87918;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background: var(--fundo);

            color: var(--texto);

            min-height: 100vh;

        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        header {

            background: var(--verde-musgo);

            color: white;

            padding: 18px 30px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.12);

        }


        .header-container {

            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .logo {

            font-size: 26px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .logo-subtitle {

            font-size: 12px;

            opacity: 0.85;

            margin-top: 3px;

        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {

            max-width: 1100px;

            margin: 40px auto;

            padding: 0 20px;

        }


        .titulo {

            margin-bottom: 8px;

            font-size: 30px;

        }


        .descricao {

            color: var(--cinza);

            margin-bottom: 25px;

        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        .pesquisa {

            background: var(--branco);

            padding: 20px;

            border-radius: 12px;

            border: 1px solid var(--borda);

            box-shadow: 0 2px 8px rgba(0,0,0,0.04);

            display: flex;

            gap: 10px;

            margin-bottom: 30px;

        }


        #campoBusca {

            flex: 1;

            padding: 14px 16px;

            border: 1px solid var(--borda);

            border-radius: 8px;

            font-size: 16px;

            outline: none;

        }


        #campoBusca:focus {

            border-color: var(--verde-musgo);

            box-shadow: 0 0 0 2px var(--verde-claro);

        }


        #botaoBuscar {

            background: var(--verde-musgo);

            color: white;

            border: none;

            border-radius: 8px;

            padding: 0 25px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        #botaoBuscar:hover {

            background: var(--verde-musgo-escuro);

        }


        /* =====================================================
           CARREGANDO
        ===================================================== */

        #carregando {

            display: none;

            text-align: center;

            padding: 30px;

            color: var(--cinza);

        }


        /* =====================================================
           RESULTADO PRINCIPAL
        ===================================================== */

        .taxon-card {

            background: white;

            border: 1px solid var(--borda);

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.04);

        }


        .taxon-nome {

            font-size: 28px;

            font-style: italic;

            color: var(--verde-musgo-escuro);

            margin-bottom: 5px;

        }


        .taxon-autoria {

            color: var(--cinza);

            margin-bottom: 20px;

        }


        /* =====================================================
           CLASSIFICAÇÃO
        ===================================================== */

        .secao-titulo {

            font-size: 19px;

            margin-bottom: 15px;

            color: var(--verde-musgo-escuro);

        }


        .classificacao {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

        }


        .classificacao-item {

            background: var(--fundo);

            border: 1px solid var(--borda);

            border-radius: 8px;

            padding: 12px;

        }


        .classificacao-label {

            display: block;

            font-size: 12px;

            color: var(--cinza);

            margin-bottom: 5px;

            text-transform: uppercase;

        }


        .classificacao-valor {

            font-weight: bold;

        }


        /* =====================================================
           FONTES
        ===================================================== */

        .fontes {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;

        }


        .fonte {

            background: white;

            border: 1px solid var(--borda);

            border-radius: 12px;

            padding: 20px;

        }


        .fonte h3 {

            margin-bottom: 15px;

            font-size: 17px;

        }


        .fonte-status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .status-ok {

            background: #E1F0DE;

            color: var(--verde-status);

        }


        .status-sinonimo {

            background: #F8E8E8;

            color: var(--vermelho);

        }


        .status-incerto {

            background: #FFF3D5;

            color: var(--amarelo);

        }


        .fonte-info {

            margin-top: 8px;

            font-size: 14px;

            line-height: 1.5;

        }


        .fonte-label {

            color: var(--cinza);

        }


        /* =====================================================
           FONTES COMPLEMENTARES
        ===================================================== */

        .fontes-complementares {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 30px;

        }


        .fonte-complementar {

            background: white;

            border: 1px solid var(--borda);

            border-radius: 12px;

            padding: 20px;

            min-height: 150px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.03);

        }


        .fonte-complementar h3 {

            font-size: 18px;

            color: var(--verde-musgo-escuro);

            margin-bottom: 10px;

        }


        .fonte-complementar p {

            color: var(--cinza);

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 12px;

        }


        .fonte-link {

            display: inline-block;

            background: var(--verde-musgo);

            color: white;

            text-decoration: none;

            padding: 9px 14px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;

        }


        .fonte-link:hover {

            background: var(--verde-musgo-escuro);

        }


        .wiki-imagem {

            max-width: 100%;

            max-height: 180px;

            display: block;

            margin: 0 auto 15px auto;

            border-radius: 8px;

        }


        /* =====================================================
           PESQUISA ACADÊMICA
        ===================================================== */

        .buscas-academicas {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 30px;

        }


        .busca-academica {

            display: block;

            background: white;

            border: 1px solid var(--borda);

            border-radius: 10px;

            padding: 18px;

            text-decoration: none;

            color: var(--texto);

            transition: 0.2s;

        }


        .busca-academica:hover {

            border-color: var(--verde-musgo);

            transform: translateY(-2px);

            box-shadow: 0 4px 10px rgba(0,0,0,0.06);

        }


        .busca-academica strong {

            display: block;

            color: var(--verde-musgo-escuro);

            margin-bottom: 7px;

        }


        .busca-academica span {

            font-size: 13px;

            color: var(--cinza);

            line-height: 1.4;

        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .mensagem {

            background: white;

            border: 1px solid var(--borda);

            border-radius: 10px;

            padding: 20px;

            text-align: center;

            color: var(--cinza);

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 800px) {

            .classificacao {

                grid-template-columns: repeat(2, 1fr);

            }

            .fontes {

                grid-template-columns: 1fr;

            }

            .fontes-complementares {

                grid-template-columns: 1fr;

            }

            .buscas-academicas {

                grid-template-columns: repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            .pesquisa {

                flex-direction: column;

            }

            #botaoBuscar {

                padding: 14px;

            }

            .classificacao {

                grid-template-columns: 1fr;

            }

            .titulo {

                font-size: 25px;

            }

            .buscas-academicas {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-container">

        <div>

            <div class="logo">SOT</div>

            <div class="logo-subtitle">
                SYSTEM OF TAXONOMY | FONTES DE PESQUISA
            </div>

        </div>

    </div>

</header>


<main>


    <h1 class="titulo">
        Consulta Taxonômica
    </h1>


    <p class="descricao">
        Consulte informações taxonômicas em diferentes fontes científicas.
    </p>


    <!-- PESQUISA -->

    <div class="pesquisa">

        <input
            type="text"
            id="campoBusca"
            placeholder="Digite um nome científico. Ex.: Solea solea"
        >

        <button
            id="botaoBuscar"
            onclick="consultarTaxon()"
        >
            Consultar
        </button>

    </div>


    <!-- CARREGANDO -->

    <div id="carregando">

        🔎 Consultando fontes taxonômicas...

    </div>


    <!-- RESULTADO -->

    <div id="resultado"></div>


</main>


<script>


// =====================================================
// ENDEREÇO DA SUA API
// =====================================================

const API_URL =
    "https://sot-api.onrender.com/api/taxon";


// =====================================================
// CONSULTAR
// =====================================================

async function consultarTaxon() {


    const campo =
        document.getElementById("campoBusca");

    const resultado =
        document.getElementById("resultado");

    const carregando =
        document.getElementById("carregando");


    const nome =
        campo.value.trim();


    if (!nome) {

        resultado.innerHTML = `
            <div class="mensagem">
                Digite um nome científico para realizar a consulta.
            </div>
        `;

        return;

    }

// =====================================================
// ATUALIZA A URL
// =====================================================

history.pushState(
    {},
    "",
    "/taxon/" + encodeURIComponent(nome)
);

    carregando.style.display = "block";

    resultado.innerHTML = "";


    try {


        const resposta =
            await fetch(
                API_URL +
                "?q=" +
                encodeURIComponent(nome)
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }


        const dados =
            await resposta.json();


        mostrarResultado(dados);


    }

    catch (erro) {

        console.error(erro);

        resultado.innerHTML = `

            <div class="mensagem">

                ❌ Não foi possível realizar a consulta.

                <br><br>

                Verifique se a API está disponível.

            </div>

        `;

    }


    finally {

        carregando.style.display = "none";

    }

}


// =====================================================
// MOSTRAR RESULTADO
// =====================================================

function mostrarResultado(dados) {


    const resultado =
        document.getElementById("resultado");


    const cb =
        dados.checklistbank;


    const worms =
        dados.worms;


    const esch =
        dados.eschmeyer;


    // =================================================
    // DADOS PRINCIPAIS
    // =================================================

    let nome =
        cb?.nome ||
        worms?.nome ||
        dados.consulta;


    let autoria =
        cb?.autoria ||
        worms?.autoria ||
        "";


    // =================================================
    // CLASSIFICAÇÃO
    // =================================================

    let reino =
        cb?.reino ||
        worms?.reino ||
        "-";


    let filo =
        cb?.filo ||
        worms?.filo ||
        "-";


    let classe =
        cb?.classe ||
        worms?.classe ||
        "-";


    let ordem =
        cb?.ordem ||
        worms?.ordem ||
        "-";


    let familia =
        cb?.familia ||
        worms?.familia ||
        "-";


    let genero =
        worms?.genero ||
        "-";


    // =================================================
    // CARD PRINCIPAL
    // =================================================

    let html = `

        <div class="taxon-card">

            <div class="taxon-nome">
                ${nome}
            </div>

            <div class="taxon-autoria">
                ${autoria}
            </div>


            <h2 class="secao-titulo">
                Classificação
            </h2>


            <div class="classificacao">

                ${itemClassificacao("Reino", reino)}

                ${itemClassificacao("Filo", filo)}

                ${itemClassificacao("Classe", classe)}

                ${itemClassificacao("Ordem", ordem)}

                ${itemClassificacao("Família", familia)}

                ${itemClassificacao("Gênero", genero)}

            </div>

        </div>


        <h2 class="secao-titulo">
            Fontes taxonômicas
        </h2>


        <div class="fontes">

            ${cardChecklistBank(cb)}

            ${cardWorms(worms)}

            ${cardEschmeyer(esch)}

        </div>


        <br>


        <h2 class="secao-titulo">
            Informações complementares
        </h2>


        <div class="fontes-complementares">

            <div
                class="fonte-complementar"
                id="wikipediaCard"
            >

                <h3>Wikipedia (English)</h3>

                <p>
                    🔎 Procurando informações...
                </p>

            </div>


            <div
                class="fonte-complementar"
                id="wikispeciesCard"
            >

                <h3>Wikispecies</h3>

                <p>
                    🔎 Procurando informações...
                </p>

            </div>

        </div>


        <h2 class="secao-titulo">
            Pesquisa acadêmica
        </h2>


        <div class="buscas-academicas">

            <a
                id="linkScholar"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <strong>🎓 Google Scholar</strong>

                <span>
                    Pesquisar artigos e trabalhos acadêmicos.
                </span>

            </a>


            <a
                id="linkPubMed"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <strong>🧬 PubMed</strong>

                <span>
                    Pesquisar literatura biomédica e científica.
                </span>

            </a>


            <a
                id="linkCrossref"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <strong>📚 Crossref</strong>

                <span>
                    Pesquisar publicações e registros acadêmicos.
                </span>

            </a>


            <a
                id="linkGoogle"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <strong>🔎 Web</strong>

                <span>
                    Pesquisar o nome científico junto com artigos científicos.
                </span>

            </a>

        </div>

    `;


    resultado.innerHTML = html;


    // =================================================
    // NOVAS CONSULTAS
    // =================================================

    consultarWikipedia(nome);

    consultarWikispecies(nome);

    configurarPesquisasAcademicas(nome);

}


// =====================================================
// ITEM DE CLASSIFICAÇÃO
// =====================================================

function itemClassificacao(label, valor) {

    return `

        <div class="classificacao-item">

            <span class="classificacao-label">
                ${label}
            </span>

            <span class="classificacao-valor">
                ${valor}
            </span>

        </div>

    `;

}


// =====================================================
// CHECKLISTBANK
// =====================================================

function cardChecklistBank(dados) {


    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>ChecklistBank</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

            </div>

        `;

    }

// -----------------------------------------------
// FAMÍLIA
// -----------------------------------------------

if (dados.rank === "family") {

    const especies =
        dados.especies || [];

    let listaEspecies = "";

    if (especies.length > 0) {

        listaEspecies = `

            <div class="fonte-info">

                <span class="fonte-label">
                    Espécies:
                </span>

                <ul
                    style="
                        margin-top: 8px;
                        padding-left: 20px;
                    "
                >

                    ${especies.map((especie) => `

                        <li
                            style="
                                margin-bottom: 6px;
                            "
                        >
                            <i>
                                ${especie.nome}
                                ${especie.autoria || ""}
                            </i>
                        </li>

                    `).join("")}

                </ul>

            </div>

        `;

    } else {

        listaEspecies = `

            <div class="fonte-info">

                Nenhuma espécie encontrada.

            </div>

        `;

    }


    return `

        <div class="fonte">

            <h3>ChecklistBank</h3>

            <span class="fonte-status status-ok">
                ✓ Família encontrada
            </span>


            <div class="fonte-info">

                <span class="fonte-label">
                    Família:
                </span>

                <i>${dados.nome}</i>

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Espécies encontradas:
                </span>

                ${especies.length}

            </div>


            ${listaEspecies}

        </div>

    `;

}

    let classeStatus =
        dados.status === "accepted"
            ? "status-ok"
            : "status-sinonimo";


    let textoStatus =
        dados.status === "accepted"
            ? "✓ Aceito"
            : "⚠ Sinônimo";


    return `

        <div class="fonte">

            <h3>ChecklistBank</h3>

            <span class="fonte-status ${classeStatus}">
                ${textoStatus}
            </span>


            <div class="fonte-info">

                <span class="fonte-label">
                    Nome:
                </span>

                <i>${dados.nome}</i>

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Autoria:
                </span>

                ${dados.autoria || "-"}

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Família:
                </span>

                ${dados.familia || "-"}

            </div>

        </div>

    `;

}


// =====================================================
// WORMS
// =====================================================

function cardWorms(dados) {


    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>WoRMS</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

            </div>

        `;

    }


    let classeStatus =
        dados.status === "accepted"
            ? "status-ok"
            : "status-sinonimo";


    let textoStatus =
        dados.status === "accepted"
            ? "✓ Aceito"
            : "⚠ Não aceito";


    return `

        <div class="fonte">

            <h3>WoRMS</h3>

            <span class="fonte-status ${classeStatus}">
                ${textoStatus}
            </span>


            <div class="fonte-info">

                <span class="fonte-label">
                    Nome:
                </span>

                <i>${dados.nome}</i>

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Nome aceito:
                </span>

                <i>${dados.nomeAceito || "-"}</i>

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Família:
                </span>

                ${dados.familia || "-"}

            </div>


            <div class="fonte-info">

                <span class="fonte-label">
                    Habitat:
                </span>

                ${habitatWorms(dados)}

            </div>

        </div>

    `;

}


// =====================================================
// HABITAT WORMS
// =====================================================

function habitatWorms(dados) {


    let habitats = [];


    if (dados.marinho)
        habitats.push("Marinho");


    if (dados.salobra)
        habitats.push("Água salobra");


    if (dados.aguaDoce)
        habitats.push("Água doce");


    if (dados.terrestre)
        habitats.push("Terrestre");


    return habitats.length
        ? habitats.join(", ")
        : "-";

}


// =====================================================
// ESCHMEYER
// =====================================================

function cardEschmeyer(dados) {

    console.log("ESCHMEYER RECEBEU:", dados);

    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>Eschmeyer's Catalog of Fishes</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

                <div class="fonte-info">

                    Nenhum registro correspondente
                    foi encontrado no catálogo de peixes.

                </div>

            </div>

        `;

    }


    // -----------------------------------------------
    // FAMÍLIA
    // -----------------------------------------------

    if (dados.tipo === "familia") {


        // Cria uma lista somente com espécies válidas
        // encontradas nos registros do Eschmeyer

        const especies = [];


        if (dados.especies) {

            dados.especies.forEach((especie) => {


                if (!especie.status)
                    return;


                if (
                    especie.status.startsWith("Valid as ")
                ) {

                    const nomeEspecie =
                        especie.status
                            .replace(
                                "Valid as ",
                                ""
                            )
                            .trim();


                    if (
                        nomeEspecie &&
                        !especies.includes(nomeEspecie)
                    ) {

                        especies.push(nomeEspecie);

                    }

                }

            });

        }


        let listaEspecies = "";


        if (especies.length > 0) {

            listaEspecies = `

                <div class="fonte-info">

                    <span class="fonte-label">
                        Espécies:
                    </span>

                    <ul
                        style="
                            margin-top: 8px;
                            padding-left: 20px;
                        "
                    >

                        ${especies.map((especie) => `

                            <li
                                style="
                                    margin-bottom: 6px;
                                "
                            >
                                <i>${especie}</i>
                            </li>

                        `).join("")}

                    </ul>

                </div>

            `;

        } else {

            listaEspecies = `

                <div class="fonte-info">

                    Nenhuma espécie válida
                    foi identificada nos registros.

                </div>

            `;

        }


        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-ok">
                    ✓ Família encontrada
                </span>


                <div class="fonte-info">

                    <span class="fonte-label">
                        Família:
                    </span>

                </div>


                <div class="fonte-info">

                    <span class="fonte-label">

                    ${especies.length}

                </div>


                ${listaEspecies}

            </div>

        `;

    }


    // -----------------------------------------------
    // VÁLIDO
    // -----------------------------------------------

    if (dados.tipo === "valido") {

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-ok">

                </span>


                <div class="fonte-info">

                    ${dados.status}

                </div>


                <div class="fonte-info">

                    </span>

                    ${dados.familia || "-"}

                </div>


                <div class="fonte-info">

                    <span class="fonte-label">

                    </span>

                    ${dados.habitat || "-"}

                </div>

        `;

    }


    // -----------------------------------------------
    // SINÔNIMO
    // -----------------------------------------------

    if (dados.tipo === "sinonimo") {

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-sinonimo">

                </span>


                <div class="fonte-info">

                    </span>

        `;

    }


    return `

            </h3>

async function consultarWikipedia(nome) {


    const card =
        document.getElementById("wikipediaCard");


    if (!card)
        return;


    try {


        const resposta =
            await fetch(
                "https://en.wikipedia.org/w/rest.php/v1/search/page?q=" +
                encodeURIComponent(nome) +
                "&limit=1"
            );


        if (!resposta.ok)
            throw new Error("Wikipedia HTTP " + resposta.status);


        const dados =
            await resposta.json();


        if (
            !dados.pages ||
            dados.pages.length === 0
        ) {

            card.innerHTML = `

                <h3>Wikipedia (English)</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

                <p>
                    Nenhuma página correspondente foi encontrada.
                </p>

            `;

            return;

        }


        const pagina =
            dados.pages[0];


        const titulo =
            pagina.title;


        const descricao =
            pagina.description ||
            "Página relacionada ao táxon consultado.";


        const url =
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(
                titulo.replace(/ /g, "_")
            );


        card.innerHTML = `

            <h3>Wikipedia (English)</h3>

            <p>
                <strong>${titulo}</strong>
            </p>

            <p>
                ${descricao}
            </p>

            <a
                class="fonte-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Abrir na Wikipedia
            </a>

        `;


    }

    catch (erro) {

        console.error(
            "Erro na Wikipedia:",
            erro
        );


        card.innerHTML = `

            <h3>Wikipedia (English)</h3>

            <span class="fonte-status status-incerto">
                Indisponível
            </span>

            <p>
                Não foi possível consultar a Wikipedia agora.
            </p>

        `;

    }

}

function configurarPesquisasAcademicas(nome) {


    const termo =
        encodeURIComponent(nome);


    const scholar =
        document.getElementById("linkScholar");


    const pubmed =
        document.getElementById("linkPubMed");


    const crossref =
        document.getElementById("linkCrossref");


    const google =
        document.getElementById("linkGoogle");


    if (scholar) {

        scholar.href =
            "https://scholar.google.com/scholar?q=" +
            termo;

    }


    if (pubmed) {

        pubmed.href =
            "https://pubmed.ncbi.nlm.nih.gov/?term=" +
            termo;

    }


    if (crossref) {

        crossref.href =
            "https://search.crossref.org/?q=" +
            termo;

    }


    if (google) {

        google.href =
            "https://www.google.com/search?q=" +
            termo +
            "+scientific+paper";

    }

}
