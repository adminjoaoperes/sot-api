<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOT - Consulta Taxonômica</title>

<style>

:root {
    --verde: #556B2F;
    --verde-escuro: #3F5222;
    --verde-claro: #E8EEDC;
    --fundo: #F5F6F2;
    --branco: #FFFFFF;
    --texto: #273026;
    --cinza: #6B716B;
    --borda: #DDE2D8;
    --sucesso: #3F7D35;
    --vermelho: #A94442;
    --amarelo: #A87918;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    min-height: 100vh;
}

header {
    background: var(--verde);
    color: white;
    padding: 18px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.header-container {
    max-width: 1200px;
    margin: auto;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo-subtitle {
    font-size: 12px;
    opacity: .85;
    margin-top: 3px;
}

main {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.titulo {
    font-size: 30px;
    margin-bottom: 8px;
}

.descricao {
    color: var(--cinza);
    margin-bottom: 25px;
}

.pesquisa {
    background: white;
    padding: 18px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

#campoBusca {
    flex: 1;
    padding: 14px 16px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

#campoBusca:focus {
    border-color: var(--verde);
    box-shadow: 0 0 0 2px var(--verde-claro);
}

#botaoBuscar {
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 28px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#botaoBuscar:hover {
    background: var(--verde-escuro);
}

#carregando {
    display: none;
    text-align: center;
    padding: 35px;
    color: var(--cinza);
}

.taxon-card {
    background: white;
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.taxon-nome {
    font-size: 29px;
    font-style: italic;
    color: var(--verde-escuro);
}

.taxon-autoria {
    color: var(--cinza);
    margin-top: 5px;
    margin-bottom: 22px;
}

.secao-titulo {
    font-size: 20px;
    color: var(--verde-escuro);
    margin: 25px 0 15px;
}

.classificacao {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.classificacao-item {
    background: var(--fundo);
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 13px;
}

.classificacao-label {
    display: block;
    color: var(--cinza);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.classificacao-valor {
    font-weight: bold;
}

.fontes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.fonte {
    background: white;
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
    min-width: 0;
}

.fonte h3 {
    margin-bottom: 12px;
    font-size: 17px;
    color: var(--verde-escuro);
}

.fonte-status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 14px;
}

.status-ok {
    background: #E1F0DE;
    color: var(--sucesso);
}

.status-sinonimo {
    background: #F8E8E8;
    color: var(--vermelho);
}

.status-incerto {
    background: #FFF3D5;
    color: var(--amarelo);
}

.fonte-info {
    margin-top: 9px;
    font-size: 14px;
    line-height: 1.5;
}

.fonte-label {
    color: var(--cinza);
}

.detalhes {
    margin-top: 18px;
    border-top: 1px solid var(--borda);
    padding-top: 15px;
}

.detalhes summary {
    cursor: pointer;
    font-weight: bold;
    color: var(--verde-escuro);
}

.lista-controle {
    margin-top: 15px;
}

.lista-controle input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: 7px;
    outline: none;
}

.lista-controle input:focus {
    border-color: var(--verde);
}

.lista-especies {
    margin-top: 12px;
    max-height: 450px;
    overflow-y: auto;
    border: 1px solid var(--borda);
    border-radius: 8px;
}

.especie {
    padding: 10px 12px;
    border-bottom: 1px solid var(--borda);
    font-size: 14px;
    line-height: 1.4;
}

.especie:last-child {
    border-bottom: none;
}

.especie:hover {
    background: var(--verde-claro);
}

.especie-nome {
    font-style: italic;
    font-weight: bold;
}

.especie-autoria {
    color: var(--cinza);
}

.especie-status {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
    background: #eee;
}

.paginacao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
}

.paginacao button {
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 13px;
    cursor: pointer;
}

.paginacao button:disabled {
    opacity: .4;
    cursor: default;
}

.pagina-info {
    color: var(--cinza);
    font-size: 13px;
}

.fontes-complementares {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.fonte-complementar {
    background: white;
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
}

.fonte-complementar h3 {
    color: var(--verde-escuro);
    margin-bottom: 10px;
}

.fonte-complementar p {
    color: var(--cinza);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.fonte-link {
    display: inline-block;
    background: var(--verde);
    color: white;
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: bold;
}

.fonte-link:hover {
    background: var(--verde-escuro);
}

.buscas-academicas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 30px;
}

.busca-academica {
    display: block;
    background: white;
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 18px;
    text-decoration: none;
    color: var(--texto);
    transition: .2s;
}

.busca-academica:hover {
    border-color: var(--verde);
    transform: translateY(-2px);
}

.busca-academica strong {
    display: block;
    color: var(--verde-escuro);
    margin-bottom: 7px;
}

.busca-academica span {
    font-size: 13px;
    color: var(--cinza);
    line-height: 1.4;
}

.mensagem {
    background: white;
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: var(--cinza);
}

.badge-contagem {
    display: inline-block;
    background: var(--verde-claro);
    color: var(--verde-escuro);
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
}

@media (max-width: 900px) {

    .fontes {
        grid-template-columns: 1fr;
    }

    .classificacao {
        grid-template-columns: repeat(2, 1fr);
    }

    .buscas-academicas {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .pesquisa {
        flex-direction: column;
    }

    #botaoBuscar {
        padding: 14px;
    }

    .classificacao,
    .fontes-complementares,
    .buscas-academicas {
        grid-template-columns: 1fr;
    }

    .titulo {
        font-size: 25px;
    }

}

</style>

</head>

<body>

<header>

<div class="header-container">

<div class="logo">SOT</div>

<div class="logo-subtitle">
SYSTEM OF TAXONOMY | FONTES DE PESQUISA
</div>

</div>

</header>

<main>

<h1 class="titulo">
Consulta Taxonômica
</h1>

<p class="descricao">
Consulte informações taxonômicas em diferentes fontes científicas.
</p>

<div class="pesquisa">

<input
type="text"
id="campoBusca"
placeholder="Digite um nome científico. Ex.: Labridae"

>

<button
id="botaoBuscar"
onclick="consultarTaxon()"

>

Consultar </button>

</div>

<div id="carregando">
🔎 Consultando fontes taxonômicas...
</div>

<div id="resultado"></div>

</main>

<script>

const API_URL =
    "https://sot-api.onrender.com/api/taxon";


// =====================================================
// SEGURANÇA
// =====================================================

function escaparHTML(valor) {

    if (valor === null || valor === undefined)
        return "";

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// CONSULTA
// =====================================================

async function consultarTaxon() {

    const campo =
        document.getElementById("campoBusca");

    const resultado =
        document.getElementById("resultado");

    const carregando =
        document.getElementById("carregando");

    const nome =
        campo.value.trim();

    if (!nome) {

        resultado.innerHTML = `
            <div class="mensagem">
                Digite um nome científico para realizar a consulta.
            </div>
        `;

        return;

    }

    history.pushState(
        {},
        "",
        "/taxon/" + encodeURIComponent(nome)
    );

    carregando.style.display = "block";
    resultado.innerHTML = "";

    try {

        const resposta =
            await fetch(
                API_URL +
                "?q=" +
                encodeURIComponent(nome)
            );

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }

        const dados =
            await resposta.json();

        mostrarResultado(dados);

    }

    catch (erro) {

        console.error(erro);

        resultado.innerHTML = `
            <div class="mensagem">
                ❌ Não foi possível realizar a consulta.
                <br><br>
                Verifique se a API está disponível.
            </div>
        `;

    }

    finally {

        carregando.style.display = "none";

    }

}


// =====================================================
// RESULTADO
// =====================================================

function mostrarResultado(dados) {

    const cb =
        dados.checklistbank;

    const worms =
        dados.worms;

    const esch =
        dados.eschmeyer;

    const nome =
        cb?.nome ||
        worms?.nome ||
        dados.consulta;

    const autoria =
        cb?.autoria ||
        worms?.autoria ||
        "";

    const reino =
        cb?.reino ||
        worms?.reino ||
        "-";

    const filo =
        cb?.filo ||
        worms?.filo ||
        "-";

    const classe =
        cb?.classe ||
        worms?.classe ||
        "-";

    const ordem =
        cb?.ordem ||
        worms?.ordem ||
        "-";

    const familia =
        cb?.familia ||
        worms?.familia ||
        "-";

    const genero =
        worms?.genero ||
        "-";

    let html = `

        <div class="taxon-card">

            <div class="taxon-nome">
                ${escaparHTML(nome)}
            </div>

            <div class="taxon-autoria">
                ${escaparHTML(autoria)}
            </div>

            <h2 class="secao-titulo">
                Classificação
            </h2>

            <div class="classificacao">

                ${itemClassificacao("Reino", reino)}
                ${itemClassificacao("Filo", filo)}
                ${itemClassificacao("Classe", classe)}
                ${itemClassificacao("Ordem", ordem)}
                ${itemClassificacao("Família", familia)}
                ${itemClassificacao("Gênero", genero)}

            </div>

        </div>

        <h2 class="secao-titulo">
            Fontes taxonômicas
        </h2>

        <div class="fontes">

            ${cardChecklistBank(cb)}

            ${cardWorms(worms)}

            ${cardEschmeyer(esch)}

        </div>

        <h2 class="secao-titulo">
            Informações complementares
        </h2>

        <div class="fontes-complementares">

            <div
                class="fonte-complementar"
                id="wikipediaCard"
            >
                <h3>Wikipedia (English)</h3>
                <p>🔎 Procurando informações...</p>
            </div>

            <div
                class="fonte-complementar"
                id="wikispeciesCard"
            >
                <h3>Wikispecies</h3>
                <p>🔎 Procurando informações...</p>
            </div>

        </div>

        <h2 class="secao-titulo">
            Pesquisa acadêmica
        </h2>

        <div class="buscas-academicas">

            <a
                id="linkScholar"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                <strong>🎓 Google Scholar</strong>
                <span>
                    Pesquisar artigos e trabalhos acadêmicos.
                </span>
            </a>

            <a
                id="linkPubMed"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                <strong>🧬 PubMed</strong>
                <span>
                    Pesquisar literatura científica.
                </span>
            </a>

            <a
                id="linkCrossref"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                <strong>📚 Crossref</strong>
                <span>
                    Pesquisar publicações acadêmicas.
                </span>
            </a>

            <a
                id="linkGoogle"
                class="busca-academica"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                <strong>🔎 Web</strong>
                <span>
                    Pesquisar informações científicas na Web.
                </span>
            </a>

        </div>

    `;

    document.getElementById("resultado").innerHTML = html;

    consultarWikipedia(nome);
    consultarWikispecies(nome);
    configurarPesquisasAcademicas(nome);

}


// =====================================================
// CLASSIFICAÇÃO
// =====================================================

function itemClassificacao(label, valor) {

    return `

        <div class="classificacao-item">

            <span class="classificacao-label">
                ${label}
            </span>

            <span class="classificacao-valor">
                ${escaparHTML(valor)}
            </span>

        </div>

    `;

}


// =====================================================
// CHECKLISTBANK
// =====================================================

function cardChecklistBank(dados) {

    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>ChecklistBank</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

            </div>

        `;

    }

    if (dados.rank === "family") {

        const especies =
            dados.especies || [];

        return `

            <div class="fonte">

                <h3>ChecklistBank</h3>

                <span class="fonte-status status-ok">
                    ✓ Família encontrada
                </span>

                ${info(
                    "Família",
                    `<i>${escaparHTML(dados.nome)}</i>`
                )}

                ${info(
                    "Autoria",
                    escaparHTML(dados.autoria || "-")
                )}

                ${info(
                    "Status",
                    escaparHTML(dados.status || "-")
                )}

                ${dados.nomeAceito
                    ? info(
                        "Nome aceito",
                        `<i>${escaparHTML(dados.nomeAceito)}</i>`
                    )
                    : ""
                }

                <div class="fonte-info">

                    <span class="fonte-label">
                        Espécies encontradas:
                    </span>

                    <span class="badge-contagem">
                        ${especies.length}
                    </span>

                </div>

                ${criarListaEspecies(
                    especies,
                    "checklist"
                )}

            </div>

        `;

    }

    const classeStatus =
        dados.status === "accepted"
            ? "status-ok"
            : "status-sinonimo";

    const textoStatus =
        dados.status === "accepted"
            ? "✓ Aceito"
            : "⚠ Sinônimo";

    return `

        <div class="fonte">

            <h3>ChecklistBank</h3>

            <span class="fonte-status ${classeStatus}">
                ${textoStatus}
            </span>

            ${info(
                "Nome",
                `<i>${escaparHTML(dados.nome)}</i>`
            )}

            ${info(
                "Autoria",
                escaparHTML(dados.autoria || "-")
            )}

            ${info(
                "Status",
                escaparHTML(dados.status || "-")
            )}

            ${info(
                "Nome aceito",
                dados.nomeAceito
                    ? `<i>${escaparHTML(dados.nomeAceito)}</i>`
                    : "-"
            )}

            ${info(
                "Família",
                escaparHTML(dados.familia || "-")
            )}

        </div>

    `;

}


// =====================================================
// WORMS
// =====================================================

function cardWorms(dados) {

    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>WoRMS</h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

            </div>

        `;

    }

    const classeStatus =
        dados.tipo === "valido"
            ? "status-ok"
            : "status-sinonimo";

    const textoStatus =
        dados.tipo === "valido"
            ? "✓ Válido"
            : "⚠ Não aceito";

    let listaFamilia = "";

    if (
        dados.rank &&
        dados.rank.toLowerCase() === "family"
    ) {

        const especies =
            dados.especies || [];

        listaFamilia = `

            <div class="fonte-info">

                <span class="fonte-label">
                    Espécies encontradas:
                </span>

                <span class="badge-contagem">
                    ${especies.length}
                </span>

            </div>

            ${criarListaEspecies(
                especies,
                "worms"
            )}

        `;

    }

    return `

        <div class="fonte">

            <h3>WoRMS</h3>

            <span class="fonte-status ${classeStatus}">
                ${textoStatus}
            </span>

            ${info(
                "AphiaID",
                escaparHTML(dados.aphiaID || "-")
            )}

            ${info(
                "Nome",
                `<i>${escaparHTML(dados.nome)}</i>`
            )}

            ${info(
                "Autoria",
                escaparHTML(dados.autoria || "-")
            )}

            ${info(
                "Rank",
                escaparHTML(dados.rank || "-")
            )}

            ${info(
                "Status",
                escaparHTML(dados.status || "-")
            )}

            ${info(
                "Nome aceito",
                dados.nomeAceito
                    ? `<i>${escaparHTML(dados.nomeAceito)}</i>`
                    : "-"
            )}

            ${info(
                "AphiaID aceito",
                escaparHTML(dados.aphiaIDAceito || "-")
            )}

            ${info(
                "Família",
                escaparHTML(dados.familia || "-")
            )}

            ${info(
                "Gênero",
                escaparHTML(dados.genero || "-")
            )}

            ${info(
                "Habitat",
                habitatWorms(dados)
            )}

            ${listaFamilia}

        </div>

    `;

}


// =====================================================
// LISTA DE ESPÉCIES
// =====================================================

function criarListaEspecies(especies, origem) {

    if (!especies || especies.length === 0) {

        return `

            <div class="detalhes">

                <div class="fonte-info">
                    Nenhuma espécie encontrada.
                </div>

            </div>

        `;

    }

    const id =
        "lista_" +
        origem +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 8);

    setTimeout(() => {

        configurarLista(
            id,
            especies,
            origem
        );

    }, 0);

    return `

        <details class="detalhes" open>

            <summary>
                Ver espécies
            </summary>

            <div
                class="lista-controle"
                id="${id}"
            >

                <input
                    type="text"
                    placeholder="Pesquisar espécie..."
                    oninput="filtrarLista('${id}')"
                >

                <div class="lista-especies"></div>

                <div class="paginacao">

                    <button
                        class="btn-anterior"
                        onclick="mudarPagina('${id}', -1)"
                    >
                        ← Anterior
                    </button>

                    <span class="pagina-info">
                        Página 1
                    </span>

                    <button
                        class="btn-proxima"
                        onclick="mudarPagina('${id}', 1)"
                    >
                        Próxima →
                    </button>

                </div>

            </div>

        </details>

    `;

}


// =====================================================
// CONTROLE DAS LISTAS
// =====================================================

const listasEspecies = {};

function configurarLista(id, especies, origem) {

    listasEspecies[id] = {

        todas: especies,
        filtradas: especies,
        pagina: 1,
        porPagina: 50,
        origem: origem

    };

    renderizarLista(id);

}


function filtrarLista(id) {

    const controle =
        document.getElementById(id);

    if (!controle)
        return;

    const termo =
        controle
            .querySelector("input")
            .value
            .toLowerCase()
            .trim();

    const lista =
        listasEspecies[id];

    if (!lista)
        return;

    lista.filtradas =
        lista.todas.filter(especie => {

            const nome =
                (
                    especie.nome ||
                    especie.scientificname ||
                    ""
                ).toLowerCase();

            return nome.includes(termo);

        });

    lista.pagina = 1;

    renderizarLista(id);

}


function mudarPagina(id, direcao) {

    const lista =
        listasEspecies[id];

    if (!lista)
        return;

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                lista.filtradas.length /
                lista.porPagina
            )
        );

    lista.pagina += direcao;

    if (lista.pagina < 1)
        lista.pagina = 1;

    if (lista.pagina > totalPaginas)
        lista.pagina = totalPaginas;

    renderizarLista(id);

}


function renderizarLista(id) {

    const controle =
        document.getElementById(id);

    const lista =
        listasEspecies[id];

    if (!controle || !lista)
        return;

    const inicio =
        (lista.pagina - 1) *
        lista.porPagina;

    const fim =
        inicio +
        lista.porPagina;

    const especiesPagina =
        lista.filtradas.slice(
            inicio,
            fim
        );

    const container =
        controle.querySelector(
            ".lista-especies"
        );

    container.innerHTML =
        especiesPagina
            .map(especie => {

                const nome =
                    especie.nome ||
                    especie.scientificname ||
                    "-";

                const autoria =
                    especie.autoria ||
                    especie.authority ||
                    "";

                const status =
                    especie.status ||
                    "";

                return `

                    <div class="especie">

                        <span class="especie-nome">
                            ${escaparHTML(nome)}
                        </span>

                        <span class="especie-autoria">
                            ${escaparHTML(
                                autoria
                            )}
                        </span>

                        ${
                            status
                                ? `
                                    <span class="especie-status">
                                        ${escaparHTML(
                                            status
                                        )}
                                    </span>
                                  `
                                : ""
                        }

                    </div>

                `;

            })
            .join("");

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                lista.filtradas.length /
                lista.porPagina
            )
        );

    const paginaInfo =
        controle.querySelector(
            ".pagina-info"
        );

    paginaInfo.textContent =
        `Página ${lista.pagina} de ${totalPaginas} — ${lista.filtradas.length} espécies`;

    controle.querySelector(
        ".btn-anterior"
    ).disabled =
        lista.pagina <= 1;

    controle.querySelector(
        ".btn-proxima"
    ).disabled =
        lista.pagina >= totalPaginas;

}


// =====================================================
// ESCHMEYER
// =====================================================

function cardEschmeyer(dados) {

    if (!dados || !dados.encontrado) {

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>

            </div>

        `;

    }

    if (dados.tipo === "familia") {

        const especies =
            dados.especies || [];

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-ok">
                    ✓ Família encontrada
                </span>

                ${info(
                    "Família",
                    `<i>${escaparHTML(dados.nome)}</i>`
                )}

                ${info(
                    "Espécies válidas",
                    `<span class="badge-contagem">${especies.length}</span>`
                )}

                ${criarListaEspecies(
                    especies,
                    "eschmeyer"
                )}

            </div>

        `;

    }

    if (dados.tipo === "valido") {

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-ok">
                    ✓ Válido
                </span>

                ${info(
                    "Status",
                    escaparHTML(dados.status || "-")
                )}

                ${info(
                    "Família",
                    escaparHTML(dados.familia || "-")
                )}

                ${info(
                    "Habitat",
                    escaparHTML(dados.habitat || "-")
                )}

            </div>

        `;

    }

    if (dados.tipo === "sinonimo") {

        return `

            <div class="fonte">

                <h3>
                    Eschmeyer's Catalog of Fishes
                </h3>

                <span class="fonte-status status-sinonimo">
                    ⚠ Sinônimo
                </span>

                ${info(
                    "Nome aceito",
                    `<i>${escaparHTML(dados.nomeAceito || "-")}</i>`
                )}

                ${info(
                    "Família",
                    escaparHTML(dados.familia || "-")
                )}

                ${info(
                    "Habitat",
                    escaparHTML(dados.habitat || "-")
                )}

            </div>

        `;

    }

    return `

        <div class="fonte">

            <h3>
                Eschmeyer's Catalog of Fishes
            </h3>

            <span class="fonte-status status-incerto">
                ⚠ Situação incerta
            </span>

        </div>

    `;

}


// =====================================================
// INFORMAÇÃO
// =====================================================

function info(label, valor) {

    return `

        <div class="fonte-info">

            <span class="fonte-label">
                ${label}:
            </span>

            ${valor}

        </div>

    `;

}


// =====================================================
// HABITAT WORMS
// =====================================================

function habitatWorms(dados) {

    const habitats = [];

    if (dados.marinho)
        habitats.push("Marinho");

    if (dados.salobra)
        habitats.push("Água salobra");

    if (dados.aguaDoce)
        habitats.push("Água doce");

    if (dados.terrestre)
        habitats.push("Terrestre");

    return habitats.length
        ? habitats.join(", ")
        : "-";

}


// =====================================================
// WIKIPEDIA
// =====================================================

async function consultarWikipedia(nome) {

    const card =
        document.getElementById(
            "wikipediaCard"
        );

    if (!card)
        return;

    try {

        const resposta =
            await fetch(
                "https://en.wikipedia.org/w/rest.php/v1/search/page?q=" +
                encodeURIComponent(nome) +
                "&limit=1"
            );

        if (!resposta.ok)
            throw new Error(
                "Wikipedia HTTP " +
                resposta.status
            );

        const dados =
            await resposta.json();

        if (
            !dados.pages ||
            dados.pages.length === 0
        ) {

            card.innerHTML = `
                <h3>Wikipedia (English)</h3>
                <span class="fonte-status status-incerto">
                    Não encontrado
                </span>
                <p>
                    Nenhuma página correspondente foi encontrada.
                </p>
            `;

            return;

        }

        const pagina =
            dados.pages[0];

        const titulo =
            pagina.title;

        const descricao =
            pagina.description ||
            "Página relacionada ao táxon consultado.";

        const url =
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(
                titulo.replace(/ /g, "_")
            );

        card.innerHTML = `

            <h3>Wikipedia (English)</h3>

            <p>
                <strong>
                    ${escaparHTML(titulo)}
                </strong>
            </p>

            <p>
                ${escaparHTML(descricao)}
            </p>

            <a
                class="fonte-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Abrir na Wikipedia
            </a>

        `;

    }

    catch (erro) {

        console.error(
            "Erro na Wikipedia:",
            erro
        );

        card.innerHTML = `
            <h3>Wikipedia (English)</h3>
            <span class="fonte-status status-incerto">
                Indisponível
            </span>
        `;

    }

}

function configurarPesquisasAcademicas(nome) {

    const termo =
        encodeURIComponent(nome);

    const scholar =
        document.getElementById(
            "linkScholar"
        );

    const pubmed =
        document.getElementById(
            "linkPubMed"
        );

    const crossref =
        document.getElementById(
            "linkCrossref"
        );

    const google =
        document.getElementById(
            "linkGoogle"
        );

    if (scholar)
        scholar.href =
            "https://scholar.google.com/scholar?q=" +
            termo;

    if (pubmed)
        pubmed.href =
            "https://pubmed.ncbi.nlm.nih.gov/?term=" +
            termo;

    if (crossref)
        crossref.href =
            "https://search.crossref.org/?q=" +
            termo;

    if (google)
        google.href =
            "https://www.google.com/search?q=" +
            termo +
            "+scientific+paper";

}
